# GitHub Light theme for Elio
# Based on ~/.themes/github_light and GitHub Primer Light design system

[palette]
bg = "#ffffff"                # Canvas background
chrome = "#f6f8fa"            # Canvas inset / top bar & status bar background
chrome_alt = "#eaeef2"        # Dialog headers & subtle borders
chip_text = "#ffffff"         # Foreground text on solid status chips
panel = "#ffffff"             # Places sidebar & preview panel background
panel_alt = "#ffffff"         # File listing pane background
surface = "#ffffff"           # Card / popup surface
elevated = "#ffffff"          # Raised elements
border = "#d0d7de"            # Standard Primer border
text = "#1f2328"              # Primary text color
muted = "#656d76"             # Muted text / secondary information
accent = "#0969da"            # GitHub blue / links & focus
accent_soft = "#ddf4ff"       # Subtle blue tint / active highlights
accent_text = "#0969da"       # Accent text for panel headings
selected_bg = "#ddf4ff"       # Selected item row background
selected_border = "#0969da"   # Active item vertical indicator
selection_bar = "#9a6700"     # Marked items indicator (Attention gold)
yank_bar = "#1a7f37"          # Yank / copy indicator (Success green)
cut_bar = "#cf222e"           # Cut / move indicator (Danger red)
progress_bar = "#0969da"      # File operation progress bar
grid_selection_band = "#fff8c5" # Marked items band in grid
grid_yank_band = "#dafbe1"    # Yanked items band in grid
grid_cut_band = "#ffebe9"     # Cut items band in grid
trash_bar = "#cf222e"         # Trash deletion chip
restore_bar = "#0969da"       # Trash restore chip
sidebar_active = "#ddf4ff"    # Places active item background
button_bg = "#f6f8fa"         # Button background
button_disabled_bg = "#f6f8fa"# Disabled button background
path_bg = "#f6f8fa"           # Path / breadcrumb bar background

[preview.code]
fg = "#1f2328"
bg = "#ffffff"
selection_bg = "#ddf4ff"
selection_fg = "#1f2328"
caret = "#0969da"
line_highlight = "#f6f8fa"
line_number = "#8c959f"
comment = "#57606a"
string = "#0a3069"
constant = "#0550ae"
keyword = "#cf222e"
function = "#8250df"
type = "#953800"
parameter = "#1f2328"
tag = "#116329"
operator = "#0550ae"
macro = "#0550ae"
invalid = "#cf222e"

[classes.directory]
color = "#54aeff"

[classes.symlink_directory]
color = "#54aeff"

[classes.broken_symlink]
color = "#cf222e"

[classes.code]
color = "#0969da"

[classes.config]
color = "#8250df"

[classes.document]
